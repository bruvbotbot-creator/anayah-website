<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Access - Anayah's Countdown</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 90%;
            color: #1e3a8a;
        }

        .login-container h1 {
            margin-bottom: 1rem;
            color: #1e3a8a;
        }

        .login-container p {
            margin-bottom: 2rem;
            color: #666;
        }

        .password-input {
            width: 100%;
            padding: 1rem;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1.1rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .password-input:focus {
            outline: none;
            border-color: #1e3a8a;
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            background: #1e3a8a;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .login-btn:hover {
            background: #1e40af;
        }

        .error-message {
            color: #dc2626;
            margin-top: 1rem;
            display: none;
        }

        @media (max-width: 768px) {
            .login-container {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🎓 Private Access</h1>
        <p>Enter the password to view Anayah's countdown</p>
        
        <form id="loginForm">
            <input 
                type="password" 
                id="passwordInput" 
                class="password-input" 
                placeholder="Enter password"
                required
            >
            <button type="submit" class="login-btn">Access Countdown</button>
        </form>
        
        <div id="errorMessage" class="error-message">
            Incorrect password. Please try again.
        </div>
    </div>

    <script>
        const correctPassword = 'AnayahCountdown2026!';
        
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const enteredPassword = document.getElementById('passwordInput').value;
            const errorMessage = document.getElementById('errorMessage');
            
            if (enteredPassword === correctPassword) {
                // Set login status
                localStorage.setItem('anayah_logged_in', 'true');
                localStorage.setItem('anayah_login_time', Date.now());
                
                // Redirect to main countdown
                window.location.href = 'countdown.html';
            } else {
                errorMessage.style.display = 'block';
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        });

        // Auto-focus password input
        document.getElementById('passwordInput').focus();
    </script>
</body>
</html>
