<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anayah Zafar | Countdown to University</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-logos"></div>
    <div class="container">
        <header>
            <h1>Anayah Zafar</h1>
            <p>Counting down to the next chapter...</p>
        </header>
        
        <main>
            <div class="countdown-section">
                <h2>University Departure</h2>
                <div id="uni-countdown" class="countdown">
                    <div class="time-unit">
                        <span id="uni-days">0</span>
                        <label>Days</label>
                    </div>
                    <div class="time-unit">
                        <span id="uni-hours">0</span>
                        <label>Hours</label>
                    </div>
                    <div class="time-unit">
                        <span id="uni-minutes">0</span>
                        <label>Minutes</label>
                    </div>
                    <div class="time-unit">
                        <span id="uni-seconds">0</span>
                        <label>Seconds</label>
                    </div>
                </div>
                <p class="countdown-date">September 15, 2026</p>
            </div>

            <div class="countdown-section special">
                <h2>Saturdays Left with Dad</h2>
                <div id="saturday-countdown" class="countdown">
                    <div class="time-unit big">
                        <span id="saturdays-left">0</span>
                        <label>Saturdays</label>
                    </div>
                </div>
                <p class="hearts">💙</p>
            </div>
        </main>
    </div>

    <!-- Logout button -->
    <div style="position: fixed; top: 20px; right: 20px;">
        <button onclick="logout()" style="background: rgba(255,255,255,0.2); color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 12px;">
            Logout
        </button>
    </div>

    <script src="script.js"></script>
    <script>
        // Check if user is logged in
        function checkLogin() {
            const isLoggedIn = localStorage.getItem('anayah_logged_in');
            const loginTime = localStorage.getItem('anayah_login_time');
            
            // Check if login expired (24 hours)
            if (isLoggedIn && loginTime) {
                const timeElapsed = Date.now() - parseInt(loginTime);
                const twentyFourHours = 24 * 60 * 60 * 1000;
                
                if (timeElapsed > twentyFourHours) {
                    logout();
                    return;
                }
            }
            
            if (!isLoggedIn) {
                window.location.href = 'login.html';
            }
        }

        function logout() {
            localStorage.removeItem('anayah_logged_in');
            localStorage.removeItem('anayah_login_time');
            window.location.href = 'login.html';
        }

        // Check login on page load
        checkLogin();
    </script>
</body>
</html>
