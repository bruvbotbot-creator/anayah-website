<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anayah Zafar | Countdown to University</title>
</head>
<body>
    <script>
        // Check login status and redirect
        function checkLoginAndRedirect() {
            const isLoggedIn = localStorage.getItem('anayah_logged_in');
            const loginTime = localStorage.getItem('anayah_login_time');
            
            // Check if login expired (24 hours)
            if (isLoggedIn && loginTime) {
                const timeElapsed = Date.now() - parseInt(loginTime);
                const twentyFourHours = 24 * 60 * 60 * 1000;
                
                if (timeElapsed > twentyFourHours) {
                    // Login expired
                    localStorage.removeItem('anayah_logged_in');
                    localStorage.removeItem('anayah_login_time');
                    window.location.href = 'login.html';
                    return;
                }
                
                // Still logged in
                window.location.href = 'countdown.html';
            } else {
                // Not logged in
                window.location.href = 'login.html';
            }
        }

        // Immediate redirect
        checkLoginAndRedirect();
    </script>
    
    <!-- Fallback content (shouldn't be seen) -->
    <div style="text-align: center; padding: 50px; font-family: Arial;">
        <p>Redirecting...</p>
    </div>
</body>
</html>
